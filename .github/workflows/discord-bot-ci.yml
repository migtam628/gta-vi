name: Discord Bot CI

on:
  push:
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot-ci.yml"
  pull_request:
    paths:
      - "discord-bot/**"
      - ".github/workflows/discord-bot-ci.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schedule preview requirements
        run: python -m pip install "python-dotenv>=1.0,<2.0" "tzdata>=2025.2"
      - name: Compile bot and publishing scripts
        working-directory: discord-bot
        run: python -m py_compile bot.py seed_channels.py auto_post.py
      - name: Validate approved bilingual schedule
        working-directory: discord-bot
        run: python auto_post.py --preview
      - name: Validate starter pack message lengths and translations
        working-directory: discord-bot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          posts = json.loads(Path("channel_seed_posts.json").read_text())["posts"]
          assert len(posts) == 6
          for post in posts:
              assert 0 < len(post["content"]) <= 2000, post["id"]
              assert "🇺🇸 **ENGLISH**" in post["content"]
              assert "🇪🇸 **ESPAÑOL**" in post["content"]
          print(f"Validated {len(posts)} bilingual starter messages")
          PY
